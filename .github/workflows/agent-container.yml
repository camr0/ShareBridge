name: Agent Container

on:
  pull_request:
    paths:
      - "agent/**"
      - "relay/**"
      - ".github/workflows/agent-container.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: camr0/sharebridge-agent

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # The relay tests run real pinned frps/frpc binaries. The cache key
      # includes the manifest digest, so a re-pin forces a fresh verified
      # download instead of reusing artifacts from the previous pin.
      - name: Restore FRP release cache
        uses: actions/cache@v4
        with:
          path: relay/.cache/frp
          key: frp-${{ hashFiles('relay/frp/manifest.json') }}

      - name: Fetch pinned FRP release
        run: ./scripts/fetch-frp.sh
        working-directory: relay

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test relay module
        run: go test ./...
        working-directory: relay

      - name: Vet relay module
        run: go vet ./...
        working-directory: relay

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The agent image bundles the pinned frpc binary. The cache key
      # includes the manifest digest, so a re-pin forces a fresh verified
      # download instead of reusing artifacts from the previous pin.
      - name: Restore FRP release cache
        uses: actions/cache@v4
        with:
          path: relay/.cache/frp
          key: frp-${{ hashFiles('relay/frp/manifest.json') }}

      # Fetches the exact pinned release over HTTPS and fails closed on any
      # digest mismatch (Task 1 mechanism); never falls back to "latest".
      - name: Fetch pinned FRP release
        run: ./scripts/fetch-frp.sh
        working-directory: relay

      # Belt-and-braces verification for the image build: re-verify the
      # cached tarball and the digest marker of the staging directory the
      # bundled binary comes from against relay/frp/manifest.json. Any
      # mismatch fails the build here, before the image is built.
      - name: Verify and stage pinned frpc into the agent build context
        working-directory: relay
        run: |
          set -euo pipefail
          staged_dir="$(./scripts/fetch-frp.sh)"
          expected_digest="$(jq -r '.artifacts.linux_amd64.sha256' frp/manifest.json)"
          pinned_version="$(jq -r '.version' frp/manifest.json)"
          marker_digest="$(cat "${staged_dir}/.verified")"
          if [[ "${marker_digest}" != "${expected_digest}" ]]; then
            echo "::error::FRP staging marker ${marker_digest} does not match the pinned manifest digest ${expected_digest}" >&2
            exit 1
          fi
          tarball_path="$(find "${CACHE_ROOT}/downloads" -name "frp_${pinned_version}_linux_amd64.tar.gz" -print -quit)"
          actual_digest="$(sha256sum "${tarball_path}" | awk '{print $1}')"
          if [[ "${actual_digest}" != "${expected_digest}" ]]; then
            echo "::error::cached FRP tarball digest ${actual_digest} does not match the pinned manifest digest ${expected_digest}" >&2
            exit 1
          fi
          cp "${staged_dir}/frpc" "${GITHUB_WORKSPACE}/agent/frpc"
          echo "Bundled verified frpc (FRP v${pinned_version}, tarball sha256 ${actual_digest}) into the agent build context"
        env:
          CACHE_ROOT: ${{ github.workspace }}/relay/.cache/frp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=sharebridge-agent
          cache-to: type=gha,mode=max,scope=sharebridge-agent
