services:
  sharebridge-agent:
    build: .
    network_mode: host
    environment:
      - SHAREBRIDGE_API_KEY=${SHAREBRIDGE_API_KEY}
      - SIGNALING_SERVER=${SIGNALING_SERVER:-wss://sharebridge.app}
      - UI_PORT=${UI_PORT:-7878}
      - UI_ADDR=${UI_ADDR:-127.0.0.1}
      - UI_PASSWORD=${UI_PASSWORD:-}
      - IMMICH_URL=${IMMICH_URL:-}
      - IMMICH_ALLOWED_HOST=${IMMICH_ALLOWED_HOST:-}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      - IMMICH_POLL_INTERVAL=${IMMICH_POLL_INTERVAL:-30}
    volumes:
      - sharebridge-agent-data:/root/.sharebridge

volumes:
  sharebridge-agent-data:
