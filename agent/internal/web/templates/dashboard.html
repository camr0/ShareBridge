{{define "content"}}
<div class="page-header">
    <h2>Active Shares</h2>
    <button class="primary"
        hx-get="/api/share-form"
        hx-target="#modal-container"
        hx-swap="innerHTML">
        + New Share
    </button>
</div>
<div id="shares-list" hx-get="/api/shares" hx-trigger="load, every 10s">
    <p class="placeholder">Loading shares...</p>
</div>
{{end}}
