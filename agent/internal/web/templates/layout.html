<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - OpenCloudShare Agent</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/custom.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong><a href="/">OpenCloudShare</a></strong></li>
            </ul>
            <ul>
                <li><a href="/" {{if eq .ActivePage "dashboard"}}aria-current="page"{{end}}>Dashboard</a></li>
                <li><a href="/history" {{if eq .ActivePage "history"}}aria-current="page"{{end}}>History</a></li>
                <li><a href="/settings" {{if eq .ActivePage "settings"}}aria-current="page"{{end}}>Settings</a></li>
            </ul>
            <ul>
                <li id="conn-status"
                    hx-get="/api/status"
                    hx-trigger="load, every 5s"
                    hx-swap="innerHTML">
                    <span class="status-chip status-chip-unknown">● Connecting...</span>
                </li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {{template "content" .}}
    </main>
    <footer class="container">
        <hr>
        <small>
            OpenCloudShare Agent v{{.Version}} · Uptime: {{.Uptime}}
            <span class="footer-links">
                <a href="#">GitHub</a> ·
                <a href="#">Docs</a> ·
                <a href="#">Report Issue</a>
            </span>
        </small>
    </footer>
    <!-- shareCreated event (from HX-Trigger header) closes the modal -->
    <div id="modal-container"></div>
</body>
</html>
