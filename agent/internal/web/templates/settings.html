{{define "content"}}
<article>
    <header>
        <hgroup>
            <h2>Settings</h2>
            <p>Configure your agent connection and defaults</p>
        </hgroup>
    </header>

    <form hx-put="/api/settings" hx-target="#settings-result">
        <fieldset>
            <legend>Signaling Server</legend>
            <div class="grid">
                <label for="signaling-url">
                    Server URL
                    <input type="url" id="signaling-url" name="signaling_url"
                        placeholder="wss://share.example.com" value="{{.Config.SignalingURL}}" required
                        {{if .EnvManaged.SignalingURL}}disabled aria-describedby="signaling-url-managed"{{end}}>
                    {{if .EnvManaged.SignalingURL}}
                    <small id="signaling-url-managed" class="env-managed-note">
                        Managed by environment variable <code>{{.EnvManaged.SignalingURL}}</code>. Remove it to edit this in the UI.
                    </small>
                    {{end}}
                </label>
                <label for="api-key">
                    API Key
                    <div class="api-key-row">
                        <input type="password" id="api-key" name="api_key"
                            placeholder="ocs_..." value="{{.Config.APIKey}}"
                            {{if .EnvManaged.APIKey}}disabled aria-describedby="api-key-managed"{{end}}>
                        <button type="button"
                            {{if .EnvManaged.APIKey}}disabled{{end}}
                            onclick="var inp=document.getElementById('api-key'); inp.type=inp.type==='password'?'text':'password'; this.textContent=inp.type==='password'?'Show':'Hide'">
                            Show
                        </button>
                    </div>
                    {{if .EnvManaged.APIKey}}
                    <small id="api-key-managed" class="env-managed-note">
                        Managed by environment variable <code>{{.EnvManaged.APIKey}}</code>. Remove it to edit this in the UI.
                    </small>
                    {{end}}
                    <small>Key shown once on creation — enter from your OpenCloud instance</small>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>OpenCloud</legend>
            <label for="allowed-host">
                Allowed Host
                <input type="text" id="allowed-host" name="allowed_host"
                    placeholder="opencloud.example.com" value="{{.Config.AllowedHost}}"
                    {{if .EnvManaged.AllowedHost}}disabled aria-describedby="allowed-host-managed"{{end}}>
                {{if .EnvManaged.AllowedHost}}
                <small id="allowed-host-managed" class="env-managed-note">
                    Managed by environment variable <code>{{.EnvManaged.AllowedHost}}</code>. Remove it to edit this in the UI.
                </small>
                {{end}}
                <small>SSRF protection — only shares from this host are allowed</small>
            </label>
        </fieldset>

        <fieldset>
            <legend>Default Share Settings</legend>
            <div class="grid">
                <label for="default-expiry">
                    Default Expiry
                    <select id="default-expiry" name="default_expiry_hours">
                        <option value="1"   {{if eq .Config.DefaultExpiry 1}}selected{{end}}>1 hour</option>
                        <option value="6"   {{if eq .Config.DefaultExpiry 6}}selected{{end}}>6 hours</option>
                        <option value="12"  {{if eq .Config.DefaultExpiry 12}}selected{{end}}>12 hours</option>
                        <option value="24"  {{if eq .Config.DefaultExpiry 24}}selected{{end}}>24 hours (1 day)</option>
                        <option value="72"  {{if eq .Config.DefaultExpiry 72}}selected{{end}}>3 days</option>
                        <option value="168" {{if eq .Config.DefaultExpiry 168}}selected{{end}}>7 days</option>
                    </select>
                </label>
                <label for="default-max-downloads">
                    Default Max Downloads
                    <input type="number" id="default-max-downloads" name="default_max_downloads"
                        placeholder="10" value="{{.Config.DefaultMaxDownloads}}" min="0">
                    <small>0 = unlimited</small>
                </label>
                <label for="default-mode">
                    Default Connection Mode
                    <select id="default-mode" name="default_relay_only">
                        <option value="false" {{if not .Config.DefaultRelayOnly}}selected{{end}}>Direct (recommended)</option>
                        <option value="true"  {{if .Config.DefaultRelayOnly}}selected{{end}}>Relay (hide IP)</option>
                    </select>
                </label>
            </div>
        </fieldset>

        <div class="grid" style="margin-top: 1.5rem;">
            <button type="submit" class="primary">Save Settings</button>
            <button type="reset">Reset</button>
        </div>

        <div id="settings-result"></div>
    </form>
</article>

<article>
    <header><h2>About</h2></header>
    <table>
        <tbody>
            <tr><th>Version</th><td>{{.Version}}</td></tr>
            <tr><th>Uptime</th><td>{{.Uptime}}</td></tr>
            <tr><th>Go</th><td>{{.GoVersion}}</td></tr>
            <tr><th>Config</th><td><code>{{.ConfigPath}}</code></td></tr>
        </tbody>
    </table>
</article>
{{end}}
