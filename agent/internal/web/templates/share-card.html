{{define "share-card"}}
<article class="share-card" id="share-{{.Code}}">
    <div class="share-card-header">
        <div>
            <strong class="share-code">{{.Code}}</strong>
            <div class="share-url">{{.ShareURL}}</div>
            <a class="share-public-url" href="{{.PublicURL}}" target="_blank">{{.PublicURL}}</a>
        </div>
        {{if .RelayOnly}}
        <span class="badge badge-relay">Relay</span>
        {{else}}
        <span class="badge badge-direct">Direct</span>
        {{end}}
    </div>
    <div class="share-card-footer">
        <span class="share-stat">Downloads: <strong>{{.Downloads}}{{if .MaxDownloads}}/{{.MaxDownloads}}{{else}}/∞{{end}}</strong></span>
        <span class="share-stat">Expires: <strong>{{.ExpiresAtFormatted}}</strong></span>
        <button class="btn-revoke outline"
            hx-delete="/api/shares/{{.Code}}"
            hx-target="closest .share-card"
            hx-swap="outerHTML swap:0.3s"
            hx-confirm="Revoke this share?">
            Revoke
        </button>
    </div>
</article>
{{end}}
