version: '3.8'

services:
  signaling-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/signaling.db
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - TURN_HOST=${TURN_HOST}  # Public IP or domain, NOT "coturn"
      - TURN_PORT=3478
      - TURN_SECRET=${TURN_SECRET}
    volumes:
      - signaling-data:/data
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=65535
      --realm=opencloudshare
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
    restart: unless-stopped

volumes:
  signaling-data:
