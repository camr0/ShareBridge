services:
  sharebridge-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/signaling.db
      - TURN_HOST=${TURN_HOST}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TURN_PORT=3478
      - TURN_SECRET=${TURN_SECRET}
    volumes:
      - sharebridge-data:/data
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=65535
      --realm=sharebridge
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
    restart: unless-stopped

volumes:
  sharebridge-data:
