<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareBridge</title>
  <link rel="stylesheet" href="/src/vendor/lightgallery/lightgallery.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #18181b;
      color: #f4f4f5;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 1rem;
    }
    h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 24px; }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      outline: none;
    }
    input:focus { border-color: #60a5fa; }
    input::placeholder { color: #a1a1aa; }
    input:disabled { opacity: 0.5; }

    button {
      margin-top: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      background: #60a5fa;
      color: #18181b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { margin: 16px 0; color: #a1a1aa; font-size: 0.9rem; min-height: 1.2em; }

    #password-section { margin-top: 16px; }
    #password-section p { margin-bottom: 8px; color: #d4d4d8; }
    #password-error { color: #f38ba8; margin-top: 8px; font-size: 0.9rem; min-height: 1.2em; }

    #file-list { margin-top: 8px; }

    .file-item {
      padding: 12px 14px;
      background: #27272a;
      border-radius: 8px;
      margin: 6px 0;
      cursor: pointer;
      border-left: 3px solid #3f3f46;
      transition: border-color 0.2s;
    }
    .file-item:hover:not(.downloading):not(.verified):not(.corrupted):not(.done) {
      background: #323236;
    }
    .file-item.downloading { border-left-color: #60a5fa; cursor: default; }
    .file-item.verified   { border-left-color: #a6e3a1; cursor: default; }
    .file-item.corrupted  { border-left-color: #f38ba8; cursor: default; }
    .file-item.failed     { border-left-color: #f38ba8; cursor: default; }
    .file-item.done       { border-left-color: #a1a1aa; cursor: default; }

    .file-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-name { font-weight: 500; word-break: break-all; }
    .file-status { font-size: 0.85rem; white-space: nowrap; margin-left: 12px; flex-shrink: 0; }
    .file-status.speed { color: #a6e3a1; }
    .file-status.ok    { color: #a6e3a1; }
    .file-status.fail  { color: #f38ba8; }

    .file-meta { margin-top: 4px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .file-size { color: #a1a1aa; font-size: 0.85rem; }
    .file-hash { color: #71717a; font-size: 0.75rem; font-family: monospace; word-break: break-all; }

    .file-progress { margin-top: 8px; }
    .file-progress-track {
      height: 3px;
      background: #3f3f46;
      border-radius: 2px;
      overflow: hidden;
    }
    .file-progress-fill {
      height: 100%;
      background: #60a5fa;
      border-radius: 2px;
      width: 0%;
      transition: width 0.15s;
    }
    .file-progress-text { color: #a1a1aa; font-size: 0.8rem; margin-top: 4px; }

    #breadcrumb {
      margin-bottom: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .breadcrumb-link {
      color: #60a5fa;
      cursor: pointer;
    }
    .breadcrumb-link:hover { text-decoration: underline; }
    .breadcrumb-current { color: #f4f4f5; }
    .breadcrumb-sep { color: #71717a; }

    .hidden { display: none; }
    #breadcrumb.hidden { display: none; }

    .connection-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .connection-direct {
      background: #10b981;
      color: white;
    }

    .connection-relay {
      background: #3b82f6;
      color: white;
    }

    .download-warning {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f9d18b;
    }

    .download-warning.hidden {
      display: none;
    }

    .download-warning-strong {
      background: rgba(243, 139, 168, 0.14);
      border-color: rgba(243, 139, 168, 0.35);
      color: #f5b3c7;
    }

    .gallery-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 1rem 0;
    }
    .gallery-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }
    .gallery-header p {
      margin: 0.25rem 0 0;
      color: #d4d4d8;
      overflow-wrap: anywhere;
    }
    .gallery-header span {
      color: #a1a1aa;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .gallery-summary {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .gallery-download-all-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .gallery-download-all {
      width: auto;
      margin: 0;
      padding: 0.4rem 0.7rem;
      border: 1px solid #52525b;
      border-radius: 6px;
      background: transparent;
      color: #d4d4d8;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .gallery-download-all:hover:not(:disabled),
    .gallery-download-all:focus-visible {
      border-color: #71717a;
      background: #27272a;
    }
    .gallery-download-all:disabled {
      cursor: default;
      opacity: 0.55;
    }
    .gallery-progress {
      margin: -0.25rem 0 1rem;
    }
    .gallery-progress.hidden {
      display: none;
    }
    .gallery-progress-row {
      display: flex;
      justify-content: flex-end;
      color: #d4d4d8;
      font-size: 0.8rem;
      margin-bottom: 0.35rem;
    }
    .gallery-progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #27272a;
    }
    .gallery-progress-fill {
      height: 100%;
      width: 0;
      background: #60a5fa;
      transition: width 160ms ease;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      width: 100%;
      margin-top: 0;
      border: 0;
      padding: 0;
      overflow: hidden;
      background: #27272a;
      border-radius: 8px;
      content-visibility: auto;
      contain-intrinsic-size: 180px 180px;
    }
    .gallery-item:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-download {
      position: absolute;
      right: 0.4rem;
      top: 0.4rem;
      display: grid;
      place-items: center;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 140ms ease;
    }
    .gallery-item:hover .gallery-download,
    .gallery-item:focus-visible .gallery-download,
    .gallery-download:focus-visible {
      opacity: 1;
    }
    .gallery-duration {
      position: absolute;
      right: 0.4rem;
      bottom: 0.4rem;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 0.75rem;
    }
    .lg-current .lg-img-wrap {
      position: relative;
    }
    .sharebridge-video-buffer-warning {
      position: absolute;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      z-index: 3;
      max-width: min(34rem, calc(100% - 2rem));
      padding: 0.55rem 0.75rem;
      border: 1px solid #f9e2af;
      border-radius: 0.5rem;
      background: rgba(24, 24, 27, 0.92);
      color: #f9e2af;
      font-size: 0.82rem;
      line-height: 1.35;
      text-align: center;
    }
    @media (max-width: 640px) {
      .gallery-header { align-items: flex-start; }
      .gallery-summary { flex-direction: column; align-items: flex-end; gap: 0.35rem; }
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <h2>ShareBridge</h2>
  <div id="join-section">
    <input id="code" placeholder="Enter session code" autocomplete="off" />
    <br>
    <button onclick="join()">Join</button>
  </div>
  <div id="status"></div>
  <div id="download-warning" class="download-warning hidden" role="status" aria-live="polite"></div>
  <div id="password-section" class="hidden">
    <p>This share is password protected.</p>
    <input id="password-input" type="password" placeholder="Enter password" />
    <button onclick="submitPassword()">Unlock</button>
    <div id="password-error"></div>
  </div>
  <div id="connection-status" class="hidden">
    <span id="connection-type" class="connection-badge">● Connected</span>
  </div>
  <section id="gallery-section" class="hidden">
    <div id="gallery-root"></div>
  </section>
  <div id="breadcrumb" class="hidden"></div>
  <div id="file-list" class="hidden"></div>
  <script>navigator.serviceWorker?.register('/sw.js',{scope:'/'})</script>
  <script src="/src/vendor/lightgallery/lightgallery.es5.min.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
