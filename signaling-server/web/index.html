<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenCloudShare</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 1rem; }
    input { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    #status { margin-top: 16px; font-weight: bold; }
    #file-list { margin-top: 20px; }
    .file-item { padding: 10px; border: 1px solid #ddd; margin: 5px 0; cursor: pointer; }
    .file-item:hover { background: #f0f0f0; }
    .file-size { color: #666; font-size: 0.9em; }
    #progress-container { margin-top: 20px; }
    #progress-bar { width: 0%; background: #4CAF50; height: 20px; transition: width 0.3s; }
    #progress-text { margin-top: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h2>OpenCloudShare</h2>
  <div id="join-section">
    <input id="code" placeholder="Enter session code" autocomplete="off" />
    <br>
    <button onclick="join()">Join</button>
  </div>
  <div id="status"></div>
  <div id="file-list" class="hidden"></div>
  <div id="progress-container" class="hidden">
    <div id="progress-bar"></div>
    <div id="progress-text">0%</div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
